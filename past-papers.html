<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Pro - Past Papers</title>
    <meta name="description" content="Access comprehensive A-Level Physics past papers from 2020-2024 with mark schemes. Practice with real exam questions and track your progress.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        accent: 'hsl(var(--accent))',
                        'accent-foreground': 'hsl(var(--accent-foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        border: 'hsl(var(--border))',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="min-h-screen bg-background">
        <!-- Navigation -->
        <div id="navigation"></div>
        
        <!-- Main Content -->
        <div class="pt-20 pb-16">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Header -->
                <div class="text-center mb-12">
                    <h1 class="text-4xl font-bold mb-4" data-testid="pastpapers-title">A-Level Physics Past Papers</h1>
                    <p class="text-xl text-muted-foreground mb-6" data-testid="pastpapers-description">
                        Practice with authentic exam questions and detailed mark schemes from AQA
                    </p>
                    <div class="bg-accent/10 border border-accent/20 rounded-lg p-4 max-w-3xl mx-auto">
                        <p class="text-sm text-accent" data-testid="pastpapers-note">
                            All papers include question papers (QP) and mark schemes (MS). Click the checkmark to track your completion progress.
                        </p>
                    </div>
                </div>

                <!-- Years Container -->
                <div class="space-y-6" data-testid="years-container">
                    <!-- Years will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="assets/js/script.js"></script>
    <script type="module" src="assets/js/past-papers-script.js"></script>
</body>
</html>
