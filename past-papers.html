<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Pro - Past Papers</title>
    <meta name="description" content="Access comprehensive A-Level Physics past papers from 2020-2024 with mark schemes. Practice with real exam questions and track your progress.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        accent: 'hsl(var(--accent))',
                        'accent-foreground': 'hsl(var(--accent-foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        border: 'hsl(var(--border))',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="min-h-screen bg-background">
        <!-- Navigation -->
        <div id="navigation"></div>
        
        <!-- Main Content -->
        <div class="pt-20 pb-16">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="mb-12">
                    <div class="hero-3d rounded-3xl h-80 w-full"></div>
                </div>
                <div class="mb-12">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <h1 class="text-4xl sm:text-5xl font-black" data-testid="pastpapers-title">A-Level Physics Past Papers</h1>
                            <p class="text-lg sm:text-xl text-muted-foreground mt-2" data-testid="pastpapers-description">
                                All recent past question papers (QP) and mark scheme (MS)
                            </p>
                        </div>
                        <div class="ml-6">
                            <div class="w-20 h-20 bg-gradient-to-br from-green-500 to-teal-500 rounded-2xl flex items-center justify-center">
                                <div class="w-7 h-7 border-2 border-white rounded opacity-80"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Years Container -->
                <div class="space-y-6" data-testid="years-container">
                    <!-- Years will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="assets/js/script.js"></script>
    <script type="module" src="assets/js/past-papers-script.js"></script>
</body>
</html>
