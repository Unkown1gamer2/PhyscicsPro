<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Pro - Test Page</title>
    <meta name="description" content="Internal testing environment.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        accent: 'var(--accent)',
                        'accent-foreground': 'var(--accent-foreground)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                        border: 'var(--border)',
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="min-h-screen bg-background">
        <div id="navigation"></div>
        
        <section class="pt-24 pb-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-7xl mx-auto">
                <div class="mb-12">
                    <div class="hero-3d rounded-3xl h-80 w-full"></div>
                </div>
                <div class="mb-12">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <h1 class="text-4xl sm:text-5xl font-black">Test Page</h1>
                            <p class="text-lg sm:text-xl text-muted-foreground mt-2">
                                Internal testing environment - Copy of Video Tutorials
                            </p>
                        </div>
                        <div class="ml-6">
                            <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-red-500 rounded-2xl flex items-center justify-center">
                                <div class="w-0 h-0 border-l-[16px] border-l-white border-t-[10px] border-t-transparent border-b-[10px] border-b-transparent ml-1"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="videos-container" class="space-y-3"></div>

                <div id="video-player" class="hidden mt-8">
                    <div class="glass-card rounded-2xl p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h3 id="current-video-title" class="text-2xl font-bold mb-1"></h3>
                                <p id="current-video-path" class="text-sm text-muted-foreground"></p>
                            </div>
                            <button onclick="closeVideo()" class="p-2 hover:bg-muted rounded-lg transition-colors duration-200">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="aspect-video rounded-lg overflow-hidden bg-black">
                            <iframe 
                                id="video-iframe"
                                class="w-full h-full" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="footer"></div>
    </div>

    <script type="module" src="assets/js/script.js"></script>
    <script type="module" src="assets/js/test-script.js"></script>
</body>
</html>
