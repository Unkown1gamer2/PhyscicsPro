<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Multi Learn Player</title>
        <meta
            name="description"
            content="Interactive Multi Learn Player."
        />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            background: "hsl(var(--background))",
                            foreground: "hsl(var(--foreground))",
                            accent: "hsl(var(--accent))",
                            "accent-foreground":
                                "hsl(var(--accent-foreground))",
                            muted: "hsl(var(--muted))",
                            "muted-foreground": "hsl(var(--muted-foreground))",
                            border: "hsl(var(--border))",
                        },
                    },
                },
            };
        </script>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css" />

        <!-- MathJax for LaTeX support -->
        <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']]
          }
        };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    </head>
    <body>
        <div class="min-h-screen bg-background">
            <!-- Navigation -->
            <div id="navigation"></div>

            <!-- Confirmation Modal -->
            <div id="exit-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/50 backdrop-blur-sm fade-in">
                <div class="glass-card max-w-md w-full p-6 rounded-2xl shadow-2xl transform transition-all">
                    <h3 class="text-xl font-bold mb-4">Unsaved Progress</h3>
                    <p class="text-muted-foreground mb-6">
                        You have unsaved progress in this lesson. If you leave now, your progress will be lost.
                    </p>
                    <div class="flex justify-end gap-3">
                        <button onclick="closeExitModal()" class="px-4 py-2 rounded-lg hover:bg-muted transition-colors">
                            Continue Learning
                        </button>
                        <button onclick="confirmExit()" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors">
                            Leave Anyway
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="max-w-4xl mx-auto px-4 py-20">
                <!-- Header & Video -->
                <div class="text-center mb-12">
                    <h1
                        id="video-title"
                        class="text-4xl font-bold mb-4"
                    >
                        Loading...
                    </h1>
                    <div class="max-w-3xl mx-auto">
                        <iframe 
                            id="video-iframe"
                            width="560" 
                            height="315" 
                            src="" 
                            title="YouTube video player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen
                            class="w-full aspect-video rounded-lg shadow-lg"
                        ></iframe>
                    </div>
                </div>

                <!-- Questions Container -->
                <div id="questions-container" class="space-y-8 pb-32">
                    <!-- Questions will be populated by JavaScript -->
                </div>

                <!-- Completion Message -->
                <div
                    id="completion-message"
                    class="hidden mt-8 text-center glass-card rounded-2xl p-8"
                >
                    <h3 class="text-2xl font-bold text-accent mb-4">
                        Lesson Complete! 🎉
                    </h3>
                    <p class="text-muted-foreground mb-6">
                        You've completed all questions for this topic.
                    </p>
                    <!-- Redirect handled by finishLesson() -->
                </div>
            </div>
            
            <div id="footer" class="hidden"></div>
        </div>

        <!-- JavaScript -->
        <script type="module" src="assets/js/script.js"></script>
        <script type="module" src="assets/js/multi-learn-player.js"></script>
    </body>
</html>
