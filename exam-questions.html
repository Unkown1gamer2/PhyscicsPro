<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Pro - Exam Questions</title>
    <meta name="description" content="A-Level Physics exam questions with mark schemes for all topics.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        accent: 'var(--accent)',
                        'accent-foreground': 'var(--accent-foreground)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                        border: 'var(--border)',
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="min-h-screen bg-background">
        <div id="navigation"></div>
        
        <section class="pt-24 pb-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-7xl mx-auto">
                <div class="mb-12">
                    <div class="hero-3d rounded-3xl h-80 w-full"></div>
                </div>
                <div class="mb-12">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <h1 class="text-4xl sm:text-5xl font-black">A-Level Physics Exam Questions</h1>
                            <p class="text-lg sm:text-xl text-muted-foreground mt-2">
                                Practice with authentic AQA exam questions and mark schemes
                            </p>
                        </div>
                        <div class="ml-6">
                            <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="topics-container" class="space-y-8"></div>
            </div>
        </section>

        <div id="footer"></div>
    </div>

    <script type="module" src="assets/js/script.js"></script>
    <script type="module" src="assets/js/exam-questions-script.js"></script>
</body>
</html>
